<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>my favorite matcha spots 🍵 ྀི⋆˚🍓࿔</title>
    <link rel="stylesheet" href="style2.css">">
</head>
<body>
	<header>
		<div class="sparkle">cathy's webdevelopment extravaganza</div>
		<h1>my favorite matcha spots 🍵 ྀི⋆˚🍓࿔</h1>
		<p>click a button to hop between cafes and sip my favorite matcha drinks.</p>
	</header>

	<main class="layout">
		<aside class="panel">
			<h2>Map Controls</h2>
			<div class="controls">
				<button id="btn-all"><span class="btn-icon">✿</span>Show All Matcha Spots</button>
				<button id="btn-series-a"><span class="btn-icon">♡</span>Strawberry Stop: Series A</button>
				<button id="btn-dumbstruck"><span class="btn-icon">★</span>Whisk Break: Dumbstruck Coffee</button>
				<button id="btn-rok"><span class="btn-icon">❀</span>Sweet Sip: rōk coffee and tea</button>
				<button class="secondary" id="btn-home"><span class="btn-icon">☁</span>Reset to Cozy View</button>
			</div>
		</aside>

		<section id="map" aria-label="Map of favorite matcha places"></section>
	</main>

	<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" />
	<script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
	<script>
		const map = new maplibregl.Map({
			container: "map",
			style: "https://api.maptiler.com/maps/019fd983-f457-7dba-97c5-07a8dc637a2e/style.json?key=domjvUPbX2qSlWXv88Xn",
			center: [-118.25, 34.05],
			zoom: 10.5
		});

		const favoriteSpots = [
			{
				id: "series-a-beverly-hills",
				name: "Series A",
				lngLat: [-118.3728589, 34.0642879],
				note: "Beverly Hills, CA",
				description: "my favorite matcha spot ever in LA. if series a has 100 fans, i am 1 of them, if series a has 10 fans, i am one of them, if series a has 1 fan, i am that fan, if series a has 0 fans, i am dead.",
				address: "8328 Wilshire Blvd, Beverly Hills, CA 90211",
				favoriteDrink: "blueberry matcha",
				rating: "5/5 strawberries"
			},
			{
				id: "dumbstruck-coffee-city-of-industry",
				name: "Dumbstruck Coffee",
				lngLat: [-117.899848, 33.9957015],
				note: "City of Industry, CA",
				description: "kinda dont really remember what i got bc i've only been once but it was remarkable enough to be my top 3 matcha spots in la so that means something!",
				address: "18508 Gale Ave, Ste B, City of Industry, CA 91748",
				favoriteDrink: "double matcha or something",
				rating: "4.6/5 strawberries"
			},
			{
				id: "rok-coffee-and-tea-los-angeles",
				name: "rōk coffee and tea",
				lngLat: [-118.3025363, 34.0525293],
				note: "Los Angeles, CA",
				description: "this place is overhyped for a reason. socal asian galore here but the matcha makes it worth it!!!",
				address: "3060 W Olympic Blvd, Ste 150, Los Angeles, CA 90006",
				favoriteDrink: "sky foam matcha",
				rating: "4.6/5 strawberries"
			}
		];

		function createPopupMarkup(spot) {
			return `
				<div class="popup-card">
					<div class="popup-kicker">matcha diary pick</div>
					<h3 class="popup-title">${spot.name}</h3>
					<p class="popup-note">${spot.description}</p>
					<ul class="popup-meta">
						<li><strong>Address:</strong> ${spot.address}</li>
						<li><strong>Favorite drink:</strong> ${spot.favoriteDrink}</li>
						<li><strong>Area:</strong> ${spot.note}</li>
					</ul>
					<div class="popup-rating">My rating: ${spot.rating}</div>
				</div>
			`;
		}

		const initialView = {
			center: [-118.25, 34.05],
			zoom: 10.5
		};

		function addFavoriteSpots(spots) {
			spots.forEach((spot) => {
				const markerEl = document.createElement("div");
				markerEl.className = "matcha-marker";

				const popup = new maplibregl.Popup({ offset: 18 }).setHTML(createPopupMarkup(spot));

				new maplibregl.Marker({ element: markerEl })
					.setLngLat(spot.lngLat)
					.setPopup(popup)
					.addTo(map);
			});
		}

		function flyToSpot(spotId) {
			const spot = favoriteSpots.find((item) => item.id === spotId);
			if (!spot) return;

			map.flyTo({
				center: spot.lngLat,
				zoom: 14,
				speed: 0.9,
				curve: 1.2
			});
		}

		function showAllSpots() {
			const bounds = new maplibregl.LngLatBounds();
			favoriteSpots.forEach((spot) => bounds.extend(spot.lngLat));
			map.fitBounds(bounds, { padding: 70, duration: 1200 });
		}

		function resetMapView() {
			map.flyTo({
				center: initialView.center,
				zoom: initialView.zoom,
				speed: 0.8
			});
		}

		map.on("load", () => {
			map.resize();
			addFavoriteSpots(favoriteSpots);
			showAllSpots();
		});

		document.getElementById("btn-all").addEventListener("click", showAllSpots);
		document.getElementById("btn-series-a").addEventListener("click", () => flyToSpot("series-a-beverly-hills"));
		document.getElementById("btn-dumbstruck").addEventListener("click", () => flyToSpot("dumbstruck-coffee-city-of-industry"));
		document.getElementById("btn-rok").addEventListener("click", () => flyToSpot("rok-coffee-and-tea-los-angeles"));
		document.getElementById("btn-home").addEventListener("click", resetMapView);
	</script>
</body>
</html>
